name: Synchronize project forks

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify and plan updates without writing destination refs
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/sync-mirrors.yml
      - config/mirrors.json
      - scripts/sync-mirror.py
      - scripts/test-sync-mirror.py

permissions:
  contents: read

concurrency:
  group: uhret-project-forks-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: python3 scripts/test-sync-mirror.py
      - id: matrix
        env:
          WORKFLOW_OWNER: ${{ github.repository_owner }}
          WORKFLOW_OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          python3 scripts/sync-mirror.py --validate-config "$WORKFLOW_OWNER" "$WORKFLOW_OWNER_ID"
          targets=$(jq -ce '[.[] | select(.mode != "disabled") | .destination | split("/")[1]]' config/mirrors.json)
          printf '%s\n' "targets=$targets" "count=$(jq length <<<"$targets")" >> "$GITHUB_OUTPUT"
          jq -r '.[] | select(.mode == "disabled") | "- \(.destination): skipped — \(.reason)"' config/mirrors.json >> "$GITHUB_STEP_SUMMARY"
  sync:
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        repository: ${{ fromJSON(needs.plan.outputs.targets) }}
    name: Sync ${{ matrix.repository }}
    steps:
      - name: Verify GitHub App configuration
        env:
          SYNC_REPOSITORY: ${{ matrix.repository }}
          HAS_APP_ID: ${{ vars.UHRET_MIRROR_APP_ID != '' }}
          HAS_PRIVATE_KEY: ${{ secrets.UHRET_MIRROR_APP_KEY != '' }}
        run: |
          if [[ "$HAS_APP_ID" != true || "$HAS_PRIVATE_KEY" != true ]]; then
            printf -- '- %s: failed. Configure the GitHub App ID and private key before syncing.\n' "$SYNC_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::GitHub App configuration is incomplete."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ vars.UHRET_MIRROR_APP_ID }}
          private-key: ${{ secrets.UHRET_MIRROR_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repository }}
          permission-administration: read
          permission-contents: write
          permission-workflows: write
      - run: python3 scripts/sync-mirror.py "$SYNC_REPOSITORY"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SYNC_REPOSITORY: ${{ matrix.repository }}
          SYNC_DRY_RUN: ${{ inputs.dry_run || false }}
